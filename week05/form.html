<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Nefi S. Yendes">
    <meta name="description" content="Form page for WDD 131 – Dynamic Web Fundamentals. This page includes a form for user input and submission.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select name="product" id="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">&star;</label>
                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">&star;</label>
                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">&star;</label>
                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">&star;</label>
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">&star;</label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label>

                <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">
                <label for="easeOfUse">Ease of Use</label>

                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>

                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </fieldset>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🐉 Nefi S. Yendes 🐉 Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
